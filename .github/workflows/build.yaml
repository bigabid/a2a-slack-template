name: Build image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ECR_REGISTRY: 091546708236.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: kagent-slack-bridge
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v6
      - name: Generate CalVer tag
        id: calver
        run: echo "tag=$(date +'%y%m%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6
        if: env.PUSH == 'true'
        with:
          role-to-assume: arn:aws:iam::091546708236:role/github-action-role
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        if: env.PUSH == 'true'
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build, tag, and push image to Amazon ECR
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: production
          push: ${{ env.PUSH == 'true' }}
          # Repo tags are immutable, so no moving `latest`.
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.calver.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
